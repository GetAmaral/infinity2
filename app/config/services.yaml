# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Video storage paths
    app.videos.originals_path: '%kernel.project_dir%/var/videos/originals'
    app.videos.hls_path: '%kernel.project_dir%/var/videos/hls'

    # WhatsApp Cloud API Parameters
    whatsapp.cloud.api.version: '%env(WHATSAPP_CLOUD_API_VERSION)%'
    whatsapp.cloud.base_url: '%env(WHATSAPP_CLOUD_BASE_URL)%'
    whatsapp.phone_number_id: '%env(WHATSAPP_PHONE_NUMBER_ID)%'
    whatsapp.access_token: '%env(WHATSAPP_ACCESS_TOKEN)%'
    whatsapp.app_secret: '%env(WHATSAPP_APP_SECRET)%'
    whatsapp.verify_token: '%env(WHATSAPP_VERIFY_TOKEN)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Generator Services - all need $projectDir parameter
    App\Service\Generator\GeneratorOrchestrator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Generator\Entity\EntityGenerator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Generator\ApiPlatform\ApiPlatformGenerator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Generator\Repository\RepositoryGenerator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Generator\Controller\ControllerGenerator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Generator\Voter\VoterGenerator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Generator\Form\FormGenerator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Generator\Template\TemplateGenerator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Generator\Navigation\NavigationGenerator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Generator\Translation\TranslationGenerator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Generator\Test\EntityTestGenerator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Generator\Test\RepositoryTestGenerator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Generator\Test\ControllerTestGenerator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Generator\Test\VoterTestGenerator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Genmax Services - new code generator
    App\Service\Genmax\GenmaxOrchestrator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Genmax\EntityGenerator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Genmax\ApiGenerator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Genmax\ControllerGenerator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Tenant Entity Processor
    # Unified processor for automatic tenant/organization assignment
    # Handles both API Platform operations and Doctrine persist events
    App\MultiTenant\TenantEntityProcessor:
        decorates: 'api_platform.doctrine.orm.state.persist_processor'
        arguments:
            $persistProcessor: '@.inner'
            $tenantContext: '@App\MultiTenant\TenantContext'
            $security: '@security.helper'
            $logger: '@logger'

    # OpenAI Service Configuration
    App\Service\OpenAI\OpenAIService:
        arguments:
            $apiKey: '%env(OPENAI_API_KEY)%'
            $model: '%env(OPENAI_MODEL)%'
            $maxTokens: '%env(int:OPENAI_MAX_TOKENS)%'
            $temperature: '%env(float:OPENAI_TEMPERATURE)%'
            $logger: '@monolog.logger'

    # WhatsApp Integration Services

    # WhatsApp Cloud API Client (Official Meta API)
    App\Service\WhatsApp\WhatsAppCloudApiClient:
        arguments:
            $httpClient: '@http_client'
            $baseUrl: '%whatsapp.cloud.base_url%'
            $apiVersion: '%whatsapp.cloud.api.version%'
            $defaultPhoneNumberId: '%whatsapp.phone_number_id%'
            $defaultAccessToken: '%whatsapp.access_token%'
            $logger: '@monolog.logger.whatsapp'

    # WhatsApp Webhook Parser (Meta webhook payload parser)
    App\Service\WhatsApp\WhatsAppWebhookParser:
        arguments:
            $appSecret: '%whatsapp.app_secret%'
            $logger: '@monolog.logger.whatsapp'

    # WhatsApp Webhook Controller (needs verify token)
    App\Controller\Api\WhatsAppWebhookController:
        arguments:
            $webhookParser: '@App\Service\WhatsApp\WhatsAppWebhookParser'
            $whatsAppService: '@App\Service\WhatsApp\WhatsAppService'
            $logger: '@monolog.logger.whatsapp'
            $verifyToken: '%whatsapp.verify_token%'
        tags: ['controller.service_arguments']

    # Main WhatsApp Service (updated for Cloud API)
    App\Service\WhatsApp\WhatsAppService:
        autowire: true
        autoconfigure: true

    # Evolution API Client (DEPRECATED - will be removed)
    App\Service\WhatsApp\EvolutionApiClient:
        autowire: true
        autoconfigure: true

    App\Service\WhatsApp\MediaDownloadService:
        autowire: true
        autoconfigure: true
        arguments:
            $tempDir: '%kernel.project_dir%/var/tmp'

    App\Service\WhatsApp\WebhookIdempotencyService:
        autowire: true
        autoconfigure: true
        arguments:
            $cache: '@cache.app'
            $ttl: 3600
