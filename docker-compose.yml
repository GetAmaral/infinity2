  nginx:
    image: nginx:1.27-alpine
    container_name: luminai_nginx
    depends_on:
      app:
        condition: service_healthy
      # evolution-api:  # Removed - no longer needed after Cloud API migration
      #   condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - luminai_network

volumes:
  postgres_data:
  redis_data:
  # evolution_instances:  # Commented out - can be removed after successful migration
  # evolution_store:      # Commented out - can be removed after successful migration

networks:
  luminai_network:
    driver: bridge