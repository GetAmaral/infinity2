services:
  database:
    image: postgres:18-alpine
    container_name: luminai_database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      # SECURITY: Bind to localhost only (127.0.0.1) for local development
      # This allows DBeaver access from host machine but NOT from network/internet
      # On VPS: Comment out or remove this ports section for production
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - luminai_network

  app:
    build: ./app
    container_name: luminai_app
    depends_on:
      database:
        condition: service_healthy
      mercure:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      FRANKENPHP_NUM_THREADS: ${FRANKENPHP_NUM_THREADS}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN}
      REDIS_URL: ${REDIS_URL}
      MERCURE_URL: ${MERCURE_URL}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
      # WhatsApp Cloud API Configuration
      WHATSAPP_CLOUD_API_VERSION: ${WHATSAPP_CLOUD_API_VERSION}
      WHATSAPP_CLOUD_BASE_URL: ${WHATSAPP_CLOUD_BASE_URL}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - luminai_network

  messenger_worker:
    build: ./app
    container_name: luminai_messenger_worker
    command: php bin/console messenger:consume async --limit=100 --memory-limit=256M --time-limit=3600
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      REDIS_URL: ${REDIS_URL}
      # WhatsApp Cloud API Configuration
      WHATSAPP_CLOUD_API_VERSION: ${WHATSAPP_CLOUD_API_VERSION}
      WHATSAPP_CLOUD_BASE_URL: ${WHATSAPP_CLOUD_BASE_URL}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
    volumes:
      - ./app:/app
    restart: unless-stopped
    networks:
      - luminai_network

  redis:
    image: redis:7-alpine
    container_name: luminai_redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru --bind 0.0.0.0 --protected-mode yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # SECURITY: Port removed - Redis only accessible within Docker network
    # External access must go through application container
    # Password authentication required (see REDIS_PASSWORD in .env)
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - luminai_network

  mercure:
    image: dunglas/mercure:latest
    container_name: luminai_mercure
    restart: unless-stopped
    volumes:
      - ./mercure/Caddyfile:/etc/caddy/Caddyfile:ro
    command: /usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:80/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - luminai_network

